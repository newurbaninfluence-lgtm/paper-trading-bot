name: paper-bot
on:
  schedule:
    - cron: "35 12 * * 1-5"   # morning session (8:35 ET summer / 7:35 ET winter): early so GitHub cron delays can't make it miss the open
    - cron: "45 14 * * 1-5"   # backup start if the morning run was skipped (GitHub sometimes drops scheduled runs)
    - cron: "15 18 * * 1-5"   # afternoon session; waits in the queue until the morning run hands off
  push:
    paths: [".trigger/live"]   # emergency start: commit a change to this file to launch a live session
  workflow_dispatch:
    inputs:
      mode:
        description: "live, selftest, configure, brief, or dryrun (dryrun needs date + tickers below)"
        default: "selftest"
      args:
        description: "for dryrun: YYYY-MM-DD TICKER1,TICKER2"
        default: ""
permissions:
  contents: write
  actions: write   # lets a finished session start the next one (approved by Faren 2026-10-12; GitHub cron runs hours late here)
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get the latest state (the previous session may have pushed after this run was queued)
        run: git pull -q --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas openpyxl
      - name: Run bot
        env:
          TZ: America/New_York
          MAX_HOURS: "5.9"
          START_DATE: "2026-10-12"
          TRADE_ALL: "1"
          ALPACA_ENDPOINT: ${{ secrets.ENDPOINT }}
          ALPACA_KEY: ${{ secrets.KEY }}
          ALPACA_SECRET: ${{ secrets.SECRET }}
          SEC_UA: ${{ vars.SEC_UA }}
          BOT_BASE: ${{ github.event.inputs.mode == 'dryrun' && '/tmp/dryrun' || '' }}
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          python -W ignore bot.py ${{ github.event.inputs.mode || 'live' }} ${{ github.event.inputs.args }}
      - name: Start the next session
        if: always() && (github.event.inputs.mode || 'live') == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # OFF SWITCH: commit a file named .trigger/stop to end the chain.
          # Only chain after a real session (>10 min), so a crash can't loop.
          git pull -q origin main || true
          if [ -f .trigger/stop ]; then echo "stop file present, not chaining"; exit 0; fi
          if [ $(( $(date +%s) - START )) -gt 600 ]; then gh workflow run bot.yml -R ${{ github.repository }} -f mode=live; else echo "short run, not chaining"; fi
