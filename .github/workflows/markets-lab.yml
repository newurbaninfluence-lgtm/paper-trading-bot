name: markets-lab
# Crypto + forex pattern finder (research only, no orders).
# Hunt on older data, exam on newer data the hunt never saw. Results land in research/*_patterns.md.
on:
  schedule:
    - cron: "0 18 * * 6"      # every Saturday
  push:
    paths: [".trigger/markets-lab"]  # start a run by committing a change to this file
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markets-lab
  cancel-in-progress: false
jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy
      - name: Crypto (Alpaca, 1h / 4h / daily)
        continue-on-error: true
        env:
          ALPACA_KEY: ${{ secrets.KEY }}
          ALPACA_SECRET: ${{ secrets.SECRET }}
        run: |
          python crypto_dl.py data/crypto BTC/USD,ETH/USD,SOL/USD,DOGE/USD,LTC/USD,AVAX/USD,LINK/USD,XRP/USD
          for tf in 1h 4h 1d; do python -W ignore markets_lab.py crypto data/crypto $tf > /dev/null; done
      - name: Restore forex months downloaded by earlier runs
        uses: actions/cache@v4
        with:
          path: data/fx/raw
          key: fxhd-raw-${{ github.run_id }}
          restore-keys: fxhd-raw-
      - name: Forex (histdata.com, 1h / 4h / daily)
        continue-on-error: true
        run: |
          python fx_dl.py data/fx EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD 2023
          for tf in 1h 4h 1d; do python -W ignore markets_lab.py forex data/fx $tf > /dev/null; done
      - name: Save results
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A research || true
          git diff --cached --quiet || git commit -qm "labs: crypto + forex patterns $(date +%F)"
          git stash -u -q || true
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 30; git pull -q --rebase -X theirs && git push -q)
