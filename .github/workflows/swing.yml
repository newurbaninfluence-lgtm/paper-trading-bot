name: swing
on:
  schedule:
    - cron: "0 22 * * 1-5"    # every weekday evening (6 PM ET summer / 5 PM winter): rebuild the swing paper books, list tomorrow's buys
    - cron: "0 16 * * 6"      # Saturday: re-run the 2-year swing backtest
  workflow_dispatch:
    inputs:
      mode:
        description: "live or backtest"
        default: "live"
      days:
        description: "backtest trading days"
        default: "500"
permissions:
  contents: write
concurrency:
  group: swing
  cancel-in-progress: false
jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy yfinance
      - name: Swing
        env:
          TZ: America/New_York
          ALPACA_KEY: ${{ secrets.KEY }}
          ALPACA_SECRET: ${{ secrets.SECRET }}
        run: python -W ignore swing.py ${{ (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 6') && 'backtest' || (github.event.inputs.mode || 'live') }} ${{ github.event.inputs.days || '500' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A research swing || true
          git diff --cached --quiet || git commit -qm "swing $(date +%F)"
          git stash -u -q || true
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 20; git pull -q --rebase -X theirs && git push -q)
